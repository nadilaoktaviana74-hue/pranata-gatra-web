<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="pgGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B38D46" />
      <stop offset="100%" stop-color="#FFE8B3" />
    </linearGradient>
    <linearGradient id="pgGoldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B38D46" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFE8B3" stop-opacity="0.05" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Frame -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#0E0E12" stroke="url(#pgGoldGradient)" stroke-width="2.5" />
  <rect x="14" y="14" width="92" height="92" rx="20" fill="url(#pgGoldSoft)" />

  <!-- Monogram / Geometric Structure "P" and "G" combined in architectonic style -->
  <!-- Outer P pillar & arch -->
  <path d="M38 32 H62 C74 32 82 40 82 50 C82 60 74 68 62 68 H48 V88 H38 V32 Z" 
        stroke="url(#pgGoldGradient)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner P counter / window -->
  <path d="M48 42 H61 C67 42 71 45 71 50 C71 55 67 58 61 58 H48 V42 Z" 
        fill="url(#pgGoldGradient)" 
        fill-opacity="0.2" 
        stroke="url(#pgGoldGradient)" 
        stroke-width="2" />

  <!-- G nested base arc -->
  <path d="M60 88 H72 C80 88 84 83 84 76 V68 H70" 
        stroke="url(#pgGoldGradient)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Accent Sparkle -->
  <circle cx="70" cy="68" r="3" fill="#FFE8B3" />
</svg>
